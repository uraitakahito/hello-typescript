version: 2
updates:
  # --- npm packages ---
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    # Wait 7 days after a release before opening update PRs, so versions still
    # too new for safe-chain's minimum-age check don't produce red PRs.
    cooldown:
      default-days: 7
    # Stay on TypeScript 6.x: typescript-eslint does not support TypeScript 7
    # yet (peer range <6.1.0). Remove once it does (typescript-eslint#10940).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Let a new action release settle for 7 days before proposing it.
    cooldown:
      default-days: 7
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"
